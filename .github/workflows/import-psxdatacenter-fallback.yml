name: Import PSXDataCenter fallback artwork

on:
  push:
    branches:
      - main
    paths:
      - "scripts/import-psxdatacenter-exact.py"
      - "data/artwork-psxdatacenter-targets.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artwork-import-main
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import exact-serial PAL covers
        run: python3 scripts/import-psxdatacenter-exact.py

      - name: Commit PSXDataCenter artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/covers src/data/game-artwork.ts data/artwork-missing.json data/artwork-psxdatacenter-report.json
          if git diff --cached --quiet; then
            echo "No PSXDataCenter artwork changes to commit."
            exit 0
          fi
          git commit -m "chore: import exact-serial PAL artwork"
          git pull --rebase origin main
          git push
