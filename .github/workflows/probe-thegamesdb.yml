name: Probe TheGamesDB

on:
  push:
    branches:
      - main
    paths:
      - "scripts/probe-thegamesdb.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe TheGamesDB
        env:
          THEGAMESDB_API_KEY: ${{ secrets.THEGAMESDB_API_KEY }}
        run: node scripts/probe-thegamesdb.mjs
