name: Refresh IGDB game metadata

on:
  workflow_dispatch:
  push:
    branches:
      - metadata-complete-snapshot
    paths:
      - "scripts/refresh-game-metadata.mjs"
      - ".github/workflows/refresh-game-metadata.yml"

permissions:
  contents: write

concurrency:
  group: igdb-metadata-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh metadata using the existing IGDB pipeline
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: npm run metadata:refresh

      - name: Validate generated snapshot
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const snapshot = JSON.parse(fs.readFileSync('src/data/game-metadata.json', 'utf8'));
          const review = JSON.parse(fs.readFileSync('data/game-metadata-review.json', 'utf8'));
          if (snapshot.schemaVersion !== 2 || !snapshot.refreshedAt || !snapshot.games || Object.keys(snapshot.games).length === 0) {
            throw new Error('Snapshot IGDB inválido ou vazio.');
          }
          if (!Array.isArray(review)) throw new Error('Relatório de revisão IGDB inválido.');
          const allowed = new Set(['matched', 'ambiguous', 'unmatched']);
          for (const [id, game] of Object.entries(snapshot.games)) {
            if (!id || !allowed.has(game.matchStatus)) throw new Error(`Estado de correspondência inválido para ${id || '(sem ID)'}.`);
            if (game.matchStatus === 'matched' && (game.source !== 'IGDB' || !Array.isArray(game.genres))) {
              throw new Error(`Metadata IGDB incompleta para ${id}.`);
            }
          }
          for (const entry of review) {
            if (!Array.isArray(entry.collectionIds) || !entry.collectionIds.length || typeof entry.title !== 'string' || typeof entry.platform !== 'string' || typeof entry.reason !== 'string' || !Array.isArray(entry.candidates) || !Array.isArray(entry.relevantAliases)) {
              throw new Error('Entrada incompleta no relatório de revisão IGDB.');
            }
          }
          console.log(`Snapshot válido: ${Object.keys(snapshot.games).length} cópias.`);
          console.log(`Relatório de revisão válido: ${review.length} grupos unresolved.`);
          NODE

      - name: Test IGDB matching and snapshot behavior
        run: npm test -- src/lib/data/igdb-refresh.test.ts

      - name: Commit metadata snapshot and review report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/game-metadata.json data/game-metadata-review.json
          if git diff --cached --quiet; then
            echo "No metadata snapshot or review report changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh IGDB game metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
