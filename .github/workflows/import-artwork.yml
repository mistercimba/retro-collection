name: Import local artwork

on:
  push:
    branches:
      - main
    paths:
      - "data/artwork-games.json"
      - "data/artwork-overrides.json"
      - "scripts/import-thegamesdb-artwork.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import PAL box art from TheGamesDB
        env:
          THEGAMESDB_API_KEY: ${{ secrets.THEGAMESDB_API_KEY }}
        run: npm run artwork:import

      - name: Show artwork status
        run: npm run artwork:status

      - name: Commit imported artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/covers src/data/game-artwork.ts data/artwork-missing.json data/artwork-tgdb-report.json
          if git diff --cached --quiet; then
            echo "No artwork changes to commit."
            exit 0
          fi
          git commit -m "chore: import local PAL artwork from TheGamesDB"
          git pull --rebase origin main
          git push
