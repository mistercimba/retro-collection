name: Import strict fallback artwork

on:
  push:
    branches:
      - main
    paths:
      - "scripts/import-strict-libretro-fallback.mjs"
      - "data/artwork-missing.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import strict PAL fallback covers
        run: node scripts/import-strict-libretro-fallback.mjs

      - name: Commit fallback artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/covers/libretro-fallback-manifest.json public/covers/*.png src/data/game-artwork.ts
          if git diff --cached --quiet; then
            echo "No fallback artwork changes to commit."
            exit 0
          fi
          git commit -m "chore: import strict PAL fallback artwork"
          git pull --rebase origin main
          git push
