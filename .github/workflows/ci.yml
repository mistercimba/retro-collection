name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    if: "!contains(github.event.head_commit.message, '[snapshot-ready]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --import tsx scripts/enrich-catalog.ts --help
      - run: npm run lint
      - run: npm run test
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npm run wishlist-artwork:check-candidates
      - run: npm run build
