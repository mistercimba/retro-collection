name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    if: github.ref != 'refs/heads/snapshot-build' && github.ref != 'refs/heads/feature/simple-library-v1' && github.ref != 'refs/heads/feature/app-library-v1' && github.head_ref != 'feature/app-library-v1' && !contains(github.event.head_commit.message, '[snapshot-ready]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # TEMPORARY: reproduce the exact npm install lock delta for this PR; remove after capturing.
      - name: Capture installed lock delta (temporary)
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const {execFileSync}=require('child_process');
          const before=JSON.parse(execFileSync('git',['show','HEAD:package-lock.json'],{encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const updated={};
          for(const [key,value] of Object.entries(after.packages)) {
            if(JSON.stringify(before.packages[key])!==JSON.stringify(value)) updated[key]=value;
          }
          const removed=Object.keys(before.packages).filter(k=>!(k in after.packages));
          console.log('LOCKDELTA:'+JSON.stringify({updated,removed}));
          NODE
      - run: npm run lint
      - run: npm run test
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: npm run wishlist-artwork:check-candidates
      - run: npm run build
