name: Import local platform artwork

on:
  push:
    branches:
      - main
    paths:
      - "data/platform-artwork-sources.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import platform artwork
        run: node scripts/import-platform-artwork.mjs

      - name: Commit platform artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/platforms src/data/platform-artwork.ts
          if git diff --cached --quiet; then
            echo "No platform artwork changes to commit."
            exit 0
          fi
          git commit -m "chore: import local platform artwork"
          git pull --rebase origin main
          git push
