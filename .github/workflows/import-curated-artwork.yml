name: Import curated exact artwork

on:
  push:
    branches:
      - main
    paths:
      - "data/artwork-curated-url-targets.json"
      - "scripts/import-curated-artwork.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artwork-import-main
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Import curated artwork
        run: python3 scripts/import-curated-artwork.py

      - name: Commit curated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/covers src/data/game-artwork.ts data/artwork-missing.json data/artwork-curated-url-report.json
          if git diff --cached --quiet; then
            echo "No curated artwork changes to commit."
            exit 0
          fi
          git commit -m "chore: import curated exact artwork"
          git pull --rebase origin main
          git push
