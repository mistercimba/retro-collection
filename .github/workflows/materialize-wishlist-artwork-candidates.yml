name: Materialize Wishlist artwork candidates

on:
  push:
    paths:
      - ".github/workflows/materialize-wishlist-artwork-candidates.yml"
      - "scripts/materialize-wishlist-artwork-candidates.mjs"
      - "src/data/wishlist-artwork-candidates.ts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wishlist-artwork-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize candidate artwork
        run: node scripts/materialize-wishlist-artwork-candidates.mjs

      - name: Commit app-owned artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/covers/wishlist-candidates
          if git diff --cached --quiet; then
            echo "All candidate artwork is already materialized."
            exit 0
          fi
          git commit -m "chore: materialize Wishlist artwork candidates"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
